baseURL = "https://whitepepper01.github.io/blog/"
locale = "en-us"
title = "whitepepper01 // security & life"
theme = "PaperMod"

# Pretty, project-path-safe URLs
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

# ---- Taxonomies (tags + categories) ----
[taxonomies]
  category = "categories"
  tag = "tags"

# ---- Main menu ----
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50

# ---- Output formats (needed for search JSON index) ----
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---- Site params ----
[params]
  env = "production"
  description = "Security writeups, OSCP/CTF walkthroughs, plus fitness, training, music and life."
  author = "whitepepper01"
  defaultTheme = "dark"      # dark by default
  disableThemeToggle = false # keep the light/dark toggle
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  showtoc = true
  comments = false

  [params.label]
    text = "whitepepper01"
    icon = "images/rabbit-8bit.png"
    iconHeight = 34

  [params.homeInfoParams]
    Title = "whitepepper01"
    Content = "Pentest & CTF writeups, OSCP grind notes — plus fitness, training, music, and life. Latest posts below."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/whitepepper01"

  [params.assets]
    disableHLJS = true  # use Hugo's built-in chroma highlighting instead

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ---- Syntax highlighting (goldmark/chroma, dark, line numbers) ----
[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true
    codeFences = true
    guessSyntax = true
    tabWidth = 4
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true   # allow raw HTML/embeds in markdown
